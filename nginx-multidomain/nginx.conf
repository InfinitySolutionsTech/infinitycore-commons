worker_processes 1;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server {
        listen 443 ssl http2;
        server_name storepro.cloud www.storepro.cloud;

        ssl_certificate     /etc/letsencrypt/storepro.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/storepro.cloud/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        location / {
            proxy_pass http://service-app-storeprocloud-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /socket/ {
            rewrite ^/socket/(.*) /$1 break;
            proxy_pass http://service-ms-core-storeprocloud:8083;
        
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://service-ms-infinitycore-security:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /appusers/ {
            rewrite ^/appusers/(.*) /$1 break;
            proxy_pass http://service-ms-users-storeprocloud:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Token $http_token;
        }

        location /appreport/ {
            rewrite ^/appreport/(.*) /$1 break;
            proxy_pass http://service-ms-reports-storeprocloud:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Token $http_token;
        }

        location /core/ {
            rewrite ^/core/(.*) /$1 break;
            proxy_pass http://service-ms-core-storeprocloud:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Token $http_token;
        }
    }

    server {
        listen 443 ssl http2;
        server_name infinityadmin.online www.infinityadmin.online;

        ssl_certificate     /etc/letsencrypt/infinityadmin.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/infinityadmin.online/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        location / {
            proxy_pass http://service-admin-platform-app-management:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
