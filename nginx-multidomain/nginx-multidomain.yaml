version: '3.8'
services:
  service-commons-nginx-multidomain:
    image: docker.io/nginx:latest
    container_name: commons-nginx-multidomain
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /opt/certs/storepro.cloud:/etc/letsencrypt/storepro.cloud:ro
      - /opt/certs/infinityadmin.online:/etc/letsencrypt/infinityadmin.online:ro
    ports:
      - "443:443"
    networks:
      - infra-storeprocloud-network
      - infra-admin-platform-network
      - infra-security-network
networks:
  infra-storeprocloud-network:
    external: true
    name: infra-storeprocloud-network
  infra-admin-platform-network:
    external: true
    name: infra-admin-platform-network
  infra-security-network:
    external: true
    name: infra-security-network